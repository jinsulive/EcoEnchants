#
# EcoEnchants
# by Auxilor
#
# 附魔台中附魔物品的选项
enchanting-table:
  enabled: true # 自定义附魔是否可以通过附魔台获得
  book-multiplier: 0.5 # 对附魔书获得附魔概率应用的乘数（用于平衡附魔数量）
  maximum-obtainable-level: 30 # 附魔台的最高等级。EcoEnchants 不会改变该限制，但如果你有插件改变了它，请调整此项以匹配。
  cap: 5 # 任意一次附魔可获得的最大魔咒数量
  reduction: 2.2 # 获得每个后续附魔的概率都会除以此数值，例如第2个附魔的概率是第1个的 2.2 分之一，第3个再除以 2.2，依此类推

# 从村民处获得自定义附魔的选项
villager:
  enabled: true # 自定义附魔是否可以通过村民获得
  pass-through-chance: 25 # 保持书籍原样、应用原版/无附魔的概率
  book-multiplier: 0.14 # 对附魔书获得附魔概率应用的乘数（用于平衡附魔数量）
  reduction: 5 # 获得每个后续附魔的概率都会除以此数值，例如第2个附魔的概率是第1个的 5 分之一，第3个再除以 5，依此类推

# 在自然战利品中获得自定义附魔的选项
loot:
  enabled: true # 自定义附魔是否可以在自然战利品中获得
  book-multiplier: 0.5 # 对附魔书获得附魔概率应用的乘数（用于平衡附魔数量）
  reduction: 7.5 # 获得每个后续附魔的概率都会除以此数值，例如第2个附魔的概率是第1个的 7.5 分之一，第3个再除以 7.5，依此类推

# 在铁砧中合并物品的选项
anvil:
  vanilla-costs: false # 如果为 true，则仅使用原版经验消耗（忽略 cost-exponent）。自定义附魔仍然生效。
  cost-exponent: 0.95 # 每个附魔等级使用的指数，用于避免频繁出现“过于昂贵！”问题
  enchant-limit: -1 # 物品上附魔数量的限制（-1 表示禁用限制）
  use-rework-penalty: true # 是否应用重命名/修复惩罚
  max-repair-cost: 40 # 覆盖最大修复消耗（-1 表示无限）。当 clamp-repair-cost 为 false 时，超过此消耗将阻止附魔。
  clamp-repair-cost: true # 是否将修复消耗限制在最大修复消耗以内

# 物品上附魔显示方式的选项
display:
  # 如果禁用显示，附魔将不会显示在物品上。仅当你已在其他地方处理显示时才禁用。
  # 更改此项需要重启服务器。
  enabled: true
  # 附魔是否应显示在物品描述（lore）的底部
  enchantments-below-lore: false

  numerals:
    enabled: true # 附魔等级是否使用罗马数字
    threshold: 10 # 超过此数值时，将使用数字而不是罗马数字

  # 未满足条件的行选项：https://hub.auxilor.io/wiki/libreforge/configuring-a-condition#example-condition
  not-met:
    format: "<strikethrough>" # 当附魔有任何未满足条件行激活时，将添加此格式

  above-max-level:
    enabled: true # 超过最大等级的附魔是否应使用自定义格式
    format: "<gradient:#1D976C:#93F9B9>" # 要应用的格式
    level-only: true # 是否仅对等级应用格式

  sort:
    type: false # 附魔是否应按时间排序
    type-order: # 类型排序顺序。如果启用类型排序，不在此列表中的类型将不会显示。
      - normal
      - special
      - curse

    length: false # 附魔是否应按长度排序

    rarity: false # 附魔是否应按稀有度排序
    rarity-order: # 稀有度排序顺序。如果启用稀有度排序，不在此列表中的稀有度将不会显示。
      - common
      - uncommon
      - rare
      - epic
      - legendary
      - special
      - veryspecial

  collapse:
    enabled: true # 附魔是否应在 lore 中折叠显示
    threshold: 9 # 超过此数量时，附魔将被折叠
    per-line: 2 # 每行放置的附魔数量
    delimiter: ",&r " # 附魔之间的分隔符

  descriptions:
    enabled: true # 是否在 lore 中显示附魔描述
    threshold: 5 # 超过此数量时，将不显示附魔描述
    word-wrap: 27 # 每行字符数
    format: "&8"

  require-enchantable: true # EcoEnchants 是否不应显示在不可附魔的物品上

# /enchantinfo GUI 的选项
enchantinfo:
  rows: 3 # GUI 的行数
  mask: # 背景材质
    items:
      - black_stained_glass_pane
    pattern: # 1 表示第一个物品，2 表示第二个物品，依此类推
      - "111111111"
      - "111101111"
      - "111111111"
  item:
    row: 2
    column: 5
    show-max-level: true # 书籍应显示为最高等级还是1级
    lore: # 描述会自动追加
      - ""
      - "&f最高等级: &a%max_level%"
      - "&f稀有度: &a%rarity%"
      - "&f可用于: &a%targets%"
      - "&f冲突附魔: &a%conflicts%"
      - "&f需要: &a%required%"

  # 自定义 GUI 槽位；操作方法见：https://hub.auxilor.io/wiki/eco/pages#custom-gui-slots
  custom-slots: [ ]

# 附魔 GUI 的选项
enchant-gui:
  rows: 6 # GUI 的行数
  title: "附魔页面 &7(%page%/%max_page%)" # GUI 的标题

  mask: # 背景材质
    items:
      - black_stained_glass_pane
    pattern: # 1 表示第一个物品，2 表示第二个物品，依此类推
      - "111101111"
      - "111111111"
      - "100000001"
      - "100000001"
      - "100000001"
      - "111111111"

  # 当没有附魔书时显示的空物品
  empty-item: gray_stained_glass_pane name:""

  # 信息物品的选项
  info:
    item: player_head name:"&a如何使用?" texture:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjcwNWZkOTRhMGM0MzE5MjdmYjRlNjM5YjBmY2ZiNDk3MTdlNDEyMjg1YTAyYjQzOWUwMTEyZGEyMmIyZTJlYyJ9fX0=
    lore:
      - "&f将物品放入上方的槽位,"
      - "&f你可以添加的所有附魔"
      - "&f都会显示在下方区域中!"
    row: 1
    column: 9

  item-row: 1 # 放入物品的槽位所在行
  item-column: 5 # 放入物品的槽位所在列

  # 翻页按钮的选项
  page-change:
    # 翻页时播放的声音
    sound:
      enabled: true
      sound: ui.button.click
      pitch: 1.0
      volume: 1.0
    forwards:
      item: arrow name:"&f下一页" # 物品。在最后一页时不显示。
      item-inactive: gray_dye name:"&7下一页" # 最后一页时显示的物品
      row: 6
      column: 6
    backwards:
      item: arrow name:"&f上一页" # 物品。在第一页时不显示。
      item-inactive: gray_dye name:"&7上一页" # 第一页时显示的物品
      row: 6
      column: 4

  # 附魔 GUI 的可选关闭按钮
  close-button:
    enabled: true
    item: barrier
    name: "&c关闭"
    lore: [ ]
    row: 6
    column: 5

  # 显示附魔的区域选项
  enchant-area:
    width: 7 # 附魔区域的宽度
    height: 3 # 附魔区域的高度
    row: 3 # 区域左上角的行
    column: 2 # 区域左上角的列

  # 自定义 GUI 槽位；操作方法见：https://hub.auxilor.io/wiki/eco/pages#custom-gui-slots
  custom-slots: [ ]

  # 如果启用，/enchant 会先打开分组选择菜单，按 group-by 设置对附魔进行分组。
  # 如果禁用，/enchant 会打开扁平附魔列表（当前行为）。
  grouped: false

  # 按什么对附魔进行分组。仅在 grouped 为 true 时使用。
  # 选项：type（来自 types.yml）、rarity（来自 rarity.yml）、target（来自 targets.yml）
  group-by: type

  # 从筛选后的子菜单返回分组选择菜单的后退按钮。
  # 仅在 grouped 为 true 时显示。
  back-button:
    enabled: true
    item: arrow name:"&f返回分组"
    lore: []
    row: 6
    column: 1

# 分组选择 GUI 的选项（仅在 enchant-gui.grouped 为 true 时使用）
group-gui:
  rows: 3
  title: "附魔分组"

  mask:
    items:
      - black_stained_glass_pane
    pattern:
      - "111111111"
      - "100000001"
      - "111111111"

  # 每个分组必须有一个唯一 id，并与 group-by 设置对应文件中的条目匹配：
  #   group-by: type   -> 来自 types.yml 的 ID（normal, spell, special, curse）
  #   group-by: rarity -> 来自 rarity.yml 的 ID（common, uncommon, rare, epic, legendary, special, veryspecial）
  #   group-by: target -> 来自 targets.yml 的 ID（sword, pickaxe, helmet, bow 等）
  # 无法识别 ID 的分组会被静默忽略。
  groups:
    - id: normal
      item: enchanted_book name:"&7普通附魔"
      lore:
        - "&f点击浏览普通附魔"
      row: 2
      column: 2
    - id: spell
      item: enchanted_book name:"<gradient:#0575E6:#1E3FBA>法术附魔"
      lore:
        - "&f点击浏览法术附魔"
      row: 2
      column: 4
    - id: special
      item: enchanted_book name:"<gradient:#FB57EC:#EF1DEC>特殊附魔"
      lore:
        - "&f点击浏览特殊附魔"
      row: 2
      column: 6
    - id: curse
      item: enchanted_book name:"&c诅咒附魔"
      lore:
        - "&f点击浏览诅咒附魔"
      row: 2
      column: 8

  # 自定义 GUI 槽位；操作方法见：https://hub.auxilor.io/wiki/eco/pages#custom-gui-slots
  custom-slots: []

# 将基于 lore 的附魔（来自其他插件）转换为同名 EcoEnchants 附魔的选项。
# 如果你正从另一个插件切换过来，并且不希望玩家丢失他们的附魔，只需开启此项。
lore-conversion:
  enabled: false # 是否启用 lore 转换
  aggressive: false # 打开时转换所有库存中的所有物品，可能会消耗大量性能
